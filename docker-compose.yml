services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: fb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: {context: ., target: base}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fb:${POSTGRES_PASSWORD}@db:5432/fb
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]   # put your existing HTTPS reverse proxy in front
    restart: unless-stopped

  worker:
    build: {context: ., target: base}
    command: ["python", "-m", "app.run_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fb:${POSTGRES_PASSWORD}@db:5432/fb
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set in .env}
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
